name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: 1

jobs:
  format-and-lint:
    name: Code Quality & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Verify code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy static analysis
        run: cargo clippy --all-targets -- -D warnings

  security-audit:
    name: Zero-Trust Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo Audit for vulnerabilities
        run: |
          cargo install cargo-audit --locked || true
          cargo audit

  test:
    name: Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run unit & integration tests
        run: cargo test --workspace --all-targets --verbose

  build-contracts:
    name: Build Soroban Contracts (wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain with wasm32v1-none
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build vault_core cdylib WASM
        run: cargo rustc --manifest-path contracts/vault_core/Cargo.toml --crate-type=cdylib --target=wasm32v1-none --release

      - name: Build stream_factory cdylib WASM
        run: cargo rustc --manifest-path contracts/stream_factory/Cargo.toml --crate-type=cdylib --target=wasm32v1-none --release

      - name: Build campaign_escrow cdylib WASM
        run: cargo rustc --manifest-path contracts/campaign_escrow/Cargo.toml --crate-type=cdylib --target=wasm32v1-none --release

      - name: Verify WASM binaries and budget constraints (< 64KB)
        run: |
          test -f target/wasm32v1-none/release/vault_core.wasm
          test -f target/wasm32v1-none/release/stream_factory.wasm
          test -f target/wasm32v1-none/release/campaign_escrow.wasm
          
          # Check size limits
          for wasm in target/wasm32v1-none/release/*.wasm; do
            SIZE=$(stat -c%s "$wasm" 2>/dev/null || stat -f%z "$wasm")
            echo "Binary: $wasm ($SIZE bytes)"
            if [ "$SIZE" -gt 65536 ]; then
              echo "Error: $wasm exceeds 64KB gas budget limit!"
              exit 1
            fi
          done
          echo "All Soroban contract WASMs generated and validated within gas size budget."
