[package]
name = "yieldbridge-core"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"
members = ["contracts/vault_core", "contracts/stream_factory"]

[dependencies]
vault_core = { path = "contracts/vault_core" }
stream_factory = { path = "contracts/stream_factory" }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
strip = "symbols"
lto = true
codegen-units = 1
